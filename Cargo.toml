[package]
name = "typing_trainer"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
directories = "6"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = "0.19"
